// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        jcenter()
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://repo.huaweicloud.com/repository/maven' }
        maven { url 'https://jitpack.io' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
//        classpath 'com.android.tools.build:gradle:4.0'
        // app/libs/framework.jar 是 Android 17 的（class 65 / Java 21），必须用 JDK 21 编译；
        // AGP 8.1.2 的 JdkImageTransform(jlink) 在 JDK 21 下会报
        // "ModuleTarget is malformed: platformString missing delimiter: android"，
        // AGP 8.5.2 起正式支持 JDK 21，配套 Gradle 8.7。
        classpath 'com.android.tools.build:gradle:8.5.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        jcenter()
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://repo.huaweicloud.com/repository/maven' }
        maven { url 'https://jitpack.io' }
        mavenCentral()
        gradlePluginPortal()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

ext {
    toolsVersion = properties.get('TOOLS_VERSION', '30.0.3')
    compileApi = properties.get('COMPILE_API', 30)
    targetApi = properties.get('TARGET_API', 30)
    minApi = properties.get('MIN_API', 26)
}

